name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Tests/Tests.csproj

      - name: Build
        run: dotnet build tests/Tests/Tests.csproj --no-restore --configuration Release

      # Builds the Blazor app once it exists in modern/
      - name: Build modern app
        if: hashFiles('modern/**/*.csproj') != ''
        run: |
          for p in $(find modern -name '*.csproj'); do dotnet build "$p" --configuration Release; done

      - name: Unit tests
        run: dotnet test tests/Tests/Tests.csproj --no-build --configuration Release --verbosity normal --filter "Category!=LegacyE2E&Category!=ModernE2E"

      - name: Install Playwright browser
        run: pwsh tests/Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start modern app and database
        run: docker compose up -d --build --wait

      - name: Playwright tests (modern app)
        run: dotnet test tests/Tests/Tests.csproj --no-build --configuration Release --verbosity normal --filter "Category=ModernE2E"
        env:
          MODERN_BASE_URL: http://localhost:8080

      - name: Show container logs
        if: failure()
        run: docker compose logs
